# Builds the pet for both IDEs and the Mac, and releases a new version by itself:
# bump pluginVersion in intellij/gradle.properties and version in vscode/package.json
# to the same number and push to main. Once everything builds and verifies, a version
# without a v<version> tag yet is published: the JetBrains plugin and the VS Code
# extension to their marketplaces (each only when it doesn't have that version), and
# a GitHub release, which creates the tag, with the Mac app's DMG and the Windows
# app's installer only. The release
# happens in this same run: a tag created by the workflow can't start another one.
#
# Other pushes to main that touch the pets, and "Run workflow" by hand, build and
# verify everything as a check and publish nothing. Pushing a v* tag by hand still
# releases that version, and re-running a release is safe. The built files are in
# the run's `pets`, `mac` and `windows` artifacts either way; a missing token skips that store
# with a warning.
#
# A new JetBrains plugin's first version is uploaded by hand from the pets artifact
# (https://plugins.jetbrains.com/plugin/add); after that this workflow updates it.
# Store tokens are repository secrets (gh secret set NAME):
#   JETBRAINS_MARKETPLACE_TOKEN  https://plugins.jetbrains.com/author/me/tokens
#   VSCE_PAT                     Azure DevOps PAT, Marketplace: Manage (retired 2026-12-01)
#   AZURE_CLIENT_ID, AZURE_TENANT_ID  VS Code Marketplace through a managed identity
#                                instead, trusted for the marketplace-publish environment
#   OVSX_PAT                     Open VSX, optional
#   MAC_SIGNING_P12, MAC_SIGNING_PASSWORD  the Mac app's self-signed certificate (base64 .p12) and its
#                                password; the same one in ~/.config/petabytes signs local builds
name: release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "intellij/**"
      - "vscode/**"
      - "web/**"
      - "mac/**"
      - "windows/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Which version this is, and whether to release it.
      - name: Version
        id: version
        shell: bash
        run: |
          plugin=$(sed -n 's/^pluginVersion=//p' intellij/gradle.properties)
          extension=$(node -p "require('./vscode/package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            release=true
          else
            if [ "$plugin" != "$extension" ]; then
              echo "::error::intellij/gradle.properties says $plugin but vscode/package.json says $extension. Bump both to the same version."
              exit 1
            fi
            version="$plugin"
            release=false
            if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] &&
               ! git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              release=true
            fi
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Version $version; release: $release"

      - name: JetBrains plugin
        working-directory: intellij
        run: |
          ./gradlew buildPlugin verifyPlugin ${{ steps.version.outputs.value && format('-PpluginVersion={0}', steps.version.outputs.value) || '' }}
          mkdir -p ../dist && cp build/distributions/*.zip ../dist/

      - name: VS Code extension
        working-directory: vscode
        run: |
          ${{ steps.version.outputs.value && format('npm version --no-git-tag-version --allow-same-version {0}', steps.version.outputs.value) || 'true' }}
          npx --yes @vscode/vsce package --out ../dist/

      - uses: actions/upload-artifact@v7
        with:
          name: pets
          path: dist/*

  # Signed with the project's own certificate when the secrets are set, so macOS sees every version as the
  # same app and keeps its permissions across updates (ad hoc otherwise). It isn't notarized: the first launch
  # needs right-click > Open.
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Mac app
        working-directory: mac
        env:
          MAC_SIGNING_P12: ${{ secrets.MAC_SIGNING_P12 }}
          MAC_SIGNING_PASSWORD: ${{ secrets.MAC_SIGNING_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./build.sh ${{ startsWith(github.ref, 'refs/tags/v') && '"$version"' || '' }}
          mkdir -p ../dist && cp build/Petabytes-*.dmg ../dist/
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: dist/*

  # The Windows app (windows/): Tauri around the same pet page, built into an installer for the current user.
  # It isn't code-signed, so SmartScreen asks once ("More info", then "Run anyway").
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/src-tauri/target
          key: windows-${{ hashFiles('windows/src-tauri/Cargo.toml', 'windows/src-tauri/Cargo.lock') }}
          restore-keys: windows-
      - name: Windows app
        working-directory: windows
        shell: bash
        run: |
          version=$(sed -n 's/^pluginVersion=//p' ../intellij/gradle.properties | tr -d '\r')
          npx --yes @tauri-apps/cli@2.9.4 build --config "{\"version\":\"$version\"}"
          mkdir -p ../dist && cp src-tauri/target/release/bundle/nsis/*-setup.exe ../dist/
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  # The GitHub release carries the Mac and Windows apps only: the extension and the plugin are
  # installed from their marketplaces, which also keep them up to date.
  # Idempotent: a rerun finds the release already there and refreshes its DMG.
  github-release:
    needs: [build, mac, windows]
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: mac
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.build.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            # Creates the tag too, on the commit this run built.
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi

      # brew install --cask chelayel/tap/petabytes. The tap is its own repository, so the workflow's token can't
      # push to it: a deploy key on Chelayel/homebrew-tap with write access can (TAP_DEPLOY_KEY holds its private
      # half), scoped to that one repo. Never fatal: the release is out either way.
      - name: Homebrew tap
        continue-on-error: true
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          version="${{ needs.build.outputs.version }}"
          sha=$(sha256sum dist/Petabytes-*.dmg | cut -d' ' -f1)
          sed -e "s/{{version}}/$version/" -e "s/{{sha256}}/$sha/" mac/homebrew/petabytes.rb > petabytes.rb
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::warning::TAP_DEPLOY_KEY is not set; the Homebrew tap was not updated. Copy the cask below to Chelayel/homebrew-tap Casks/petabytes.rb by hand."
            cat petabytes.rb
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key && chmod 600 ~/.ssh/tap_key
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:Chelayel/homebrew-tap.git /tmp/tap
          mkdir -p /tmp/tap/Casks && cp petabytes.rb /tmp/tap/Casks/petabytes.rb
          cd /tmp/tap
          git add Casks/petabytes.rb
          git -c user.name="petabytes release" -c user.email="release@petabytes.invalid" commit -m "petabytes $version" >/dev/null 2>&1 || { echo "Tap already at $version."; exit 0; }
          git push origin HEAD
          echo "Tap updated to $version."

  # Each store gets the version only when it does not have it already.
  # Tokens: see the top of this file.
  stores:
    needs: [build]
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: marketplace-publish
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: pets
          path: dist

      - name: Versions
        id: v
        shell: bash
        # `|| true`: a store that doesn't list the extension yet is "nothing", not a failure.
        run: |
          version="${{ needs.build.outputs.version }}"
          jb=$(curl -sS "https://plugins.jetbrains.com/plugins/list?pluginId=com.chelayel.petabytes" | grep -o '<version>[^<]*</version>' | head -1 | sed 's/<[^>]*>//g' || true)
          ms=$(npx --yes @vscode/vsce show chelayel.petabytes --json 2>/dev/null | node -p "try{JSON.parse(require('fs').readFileSync(0,'utf8')).versions[0].version}catch(e){''}" || true)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "jb=$jb" >> "$GITHUB_OUTPUT"; echo "ms=$ms" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (JetBrains Marketplace has ${jb:-nothing}; VS Code Marketplace has ${ms:-nothing})"

      # Not skipped when the listing shows nothing: a plugin in review isn't listed but takes updates.
      - name: JetBrains Marketplace
        if: steps.v.outputs.version != steps.v.outputs.jb
        working-directory: intellij
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: |
          if [ -z "$JETBRAINS_MARKETPLACE_TOKEN" ]; then
            echo "::warning::JETBRAINS_MARKETPLACE_TOKEN is not set; skipping the JetBrains Marketplace upload."
            exit 0
          fi
          # A version the Marketplace already holds is done, not a failure: the
          # listing above can lag an upload.
          set -o pipefail
          if ./gradlew publishPlugin -PpluginVersion="${{ steps.v.outputs.version }}" 2>&1 | tee publish.log; then
            echo "Published the JetBrains plugin ${{ steps.v.outputs.version }}."
          elif grep -q "already contains version" publish.log; then
            echo "::notice::The JetBrains Marketplace already has ${{ steps.v.outputs.version }}."
          elif grep -qiE "not found|does not exist|No plugin" publish.log; then
            # A new plugin's first version is uploaded by hand on the Marketplace site; after that
            # the API takes updates, even while the first one is still in review (and unlisted).
            echo "::warning::Petabytes isn't on the JetBrains Marketplace yet. Upload the first version by hand from the run's pets artifact: https://plugins.jetbrains.com/plugin/add"
          else
            exit 1
          fi

      # Preferred: a managed identity that is a Contributor on the publisher,
      # reached through GitHub's OIDC token. Fallback: an Azure DevOps PAT, which
      # Microsoft retires on 2026-12-01.
      - name: Azure sign-in (managed identity)
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: VS Code Marketplace
        if: steps.v.outputs.version != steps.v.outputs.ms
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        # The Marketplace sometimes stalls, so a failed upload is tried again;
        # --skip-duplicate makes that safe when the timed-out attempt landed.
        run: |
          vsix=$(ls dist/petabytes-*.vsix | head -1)
          if [ -n "$AZURE_CLIENT_ID" ]; then auth=(--azure-credential)
          elif [ -n "$VSCE_PAT" ]; then auth=()
          else
            echo "::warning::Neither AZURE_CLIENT_ID nor VSCE_PAT is set; skipping the VS Code Marketplace upload."
            exit 0
          fi
          for attempt in 1 2 3; do
            npx --yes @vscode/vsce publish --packagePath "$vsix" --skip-duplicate "${auth[@]}" && exit 0
            [ "$attempt" -lt 3 ] && { echo "::warning::VS Code Marketplace upload failed (attempt $attempt of 3); retrying in $((attempt * 60)) s."; sleep $((attempt * 60)); }
          done
          exit 1

      - name: Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::OVSX_PAT is not set; skipping Open VSX (VSCodium and other VS Code forks)."
            exit 0
          fi
          npx --yes ovsx publish "$(ls dist/petabytes-*.vsix | head -1)" -p "$OVSX_PAT" --skip-duplicate
