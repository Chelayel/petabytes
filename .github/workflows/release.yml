# Builds the pet for both IDEs and publishes it on a tag:
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# A tag ships the JetBrains plugin and the VS Code extension at the tag's
# version, each only when its store does not have that version yet, so
# re-running a tag is safe. A push to main that touches either IDE or the shared
# page builds and verifies both as a check and uploads nothing. "Run workflow" by hand is the
# same dry run. A missing token skips that store with a warning; the built files
# are in the run's `pets` artifact either way.
name: release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "intellij/**"
      - "vscode/**"
      - "web/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: JetBrains plugin
        working-directory: intellij
        run: |
          ./gradlew buildPlugin verifyPlugin ${{ steps.version.outputs.value && format('-PpluginVersion={0}', steps.version.outputs.value) || '' }}
          mkdir -p ../dist && cp build/distributions/*.zip ../dist/

      - name: VS Code extension
        working-directory: vscode
        run: |
          ${{ steps.version.outputs.value && format('npm version --no-git-tag-version --allow-same-version {0}', steps.version.outputs.value) || 'true' }}
          npx --yes @vscode/vsce package --out ../dist/

      - uses: actions/upload-artifact@v4
        with:
          name: pets
          path: dist/*

  # The GitHub release carries both files, for anyone installing from disk.
  # Idempotent: a rerun finds the release already there and refreshes its assets.
  github-release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pets
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
          fi

  # Each store gets the tag's version only when it does not have it already.
  # Tokens: see the README's Publishing section.
  stores:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: marketplace-publish
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: pets
          path: dist

      - name: Versions
        id: v
        shell: bash
        # `|| true`: a store that doesn't list the extension yet is "nothing", not a failure.
        run: |
          version="${GITHUB_REF_NAME#v}"
          jb=$(curl -sS "https://plugins.jetbrains.com/plugins/list?pluginId=com.chelayel.tidepets" | grep -o '<version>[^<]*</version>' | head -1 | sed 's/<[^>]*>//g' || true)
          ms=$(npx --yes @vscode/vsce show chelayel.tide-pets --json 2>/dev/null | node -p "try{JSON.parse(require('fs').readFileSync(0,'utf8')).versions[0].version}catch(e){''}" || true)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "jb=$jb" >> "$GITHUB_OUTPUT"; echo "ms=$ms" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (JetBrains Marketplace has ${jb:-nothing}; VS Code Marketplace has ${ms:-nothing})"

      - name: JetBrains Marketplace
        if: steps.v.outputs.version != steps.v.outputs.jb
        working-directory: intellij
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: |
          if [ -z "$JETBRAINS_MARKETPLACE_TOKEN" ]; then
            echo "::warning::JETBRAINS_MARKETPLACE_TOKEN is not set; skipping the JetBrains Marketplace upload."
            exit 0
          fi
          # A new plugin's first version is uploaded by hand on the Marketplace site;
          # the API only accepts updates to a plugin that already exists.
          if [ -z "${{ steps.v.outputs.jb }}" ]; then
            echo "::warning::Tide Pets isn't on the JetBrains Marketplace yet. Upload the first version by hand from the run's pets artifact: https://plugins.jetbrains.com/plugin/add"
            exit 0
          fi
          # A version the Marketplace already holds is done, not a failure: the
          # listing above can lag an upload.
          set -o pipefail
          if ./gradlew publishPlugin -PpluginVersion="${{ steps.v.outputs.version }}" 2>&1 | tee publish.log; then
            echo "Published the JetBrains plugin ${{ steps.v.outputs.version }}."
          elif grep -q "already contains version" publish.log; then
            echo "::notice::The JetBrains Marketplace already has ${{ steps.v.outputs.version }}."
          else
            exit 1
          fi

      # Preferred: a managed identity that is a Contributor on the publisher,
      # reached through GitHub's OIDC token. Fallback: an Azure DevOps PAT, which
      # Microsoft retires on 2026-12-01.
      - name: Azure sign-in (managed identity)
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: VS Code Marketplace
        if: steps.v.outputs.version != steps.v.outputs.ms
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        # The Marketplace sometimes stalls, so a failed upload is tried again;
        # --skip-duplicate makes that safe when the timed-out attempt landed.
        run: |
          vsix=$(ls dist/tide-pets-*.vsix | head -1)
          if [ -n "$AZURE_CLIENT_ID" ]; then auth=(--azure-credential)
          elif [ -n "$VSCE_PAT" ]; then auth=()
          else
            echo "::warning::Neither AZURE_CLIENT_ID nor VSCE_PAT is set; skipping the VS Code Marketplace upload."
            exit 0
          fi
          for attempt in 1 2 3; do
            npx --yes @vscode/vsce publish --packagePath "$vsix" --skip-duplicate "${auth[@]}" && exit 0
            [ "$attempt" -lt 3 ] && { echo "::warning::VS Code Marketplace upload failed (attempt $attempt of 3); retrying in $((attempt * 60)) s."; sleep $((attempt * 60)); }
          done
          exit 1

      - name: Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::OVSX_PAT is not set; skipping Open VSX (VSCodium and other VS Code forks)."
            exit 0
          fi
          npx --yes ovsx publish "$(ls dist/tide-pets-*.vsix | head -1)" -p "$OVSX_PAT" --skip-duplicate
